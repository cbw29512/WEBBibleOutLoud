name: Verify live WEB Bible Out Loud deployment
on:
  pull_request:
    paths:
      - 'scripts/verify-live-site.py'
      - '.github/workflows/verify-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public website serves the expected new version
        run: python scripts/verify-live-site.py
