name: Lighthouse site quality audit
on:
  pull_request:
    paths:
      - 'site/**'
      - 'data/videos.json'
      - 'scripts/render-videos.cjs'
      - '.github/workflows/lighthouse-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Build the site's actual published HTML
        run: node scripts/render-videos.cjs
      - name: Install pinned Lighthouse 13.5.0
        run: npm install --no-save --no-audit --no-fund lighthouse@13.5.0
      - name: Audit mobile locally (no production mutation)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/webbible-server.log 2>&1 &
          sleep 2
          ./node_modules/.bin/lighthouse http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/webbible-lighthouse.json --quiet
          node - <<'NODE'
          const fs = require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/webbible-lighthouse.json','utf8'));
          console.log('Lighthouse version: '+r.lighthouseVersion);
          console.log('Final URL: '+r.finalDisplayedUrl);
          for(const [key,v] of Object.entries(r.categories)) console.log(key+': '+Math.round(v.score*100)+'/100');
          for(const [key,a] of Object.entries(r.audits)){
            if(a.score!==null&&a.score<0.9&&a.scoreDisplayMode!=='informative'&&['error','manual'].includes(a.scoreDisplayMode)===false)
              console.log('IMPROVE '+key+': '+a.title+' ('+(a.displayValue||'')+')');
          }
          for(const id of ['errors-in-console','label-content-name-mismatch']) {
            const audit=r.audits[id];
            console.log('DETAIL '+id+': '+JSON.stringify((audit?.details?.items||[]).slice(0,12)).slice(0,8000));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webbible-mobile-lighthouse-report
          path: /tmp/webbible-lighthouse.json
          if-no-files-found: warn
